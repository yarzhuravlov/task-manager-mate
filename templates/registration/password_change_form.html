{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Change Password</h5>
          </div>
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              {{ form|crispy }}
              <button type="submit" class="btn btn-primary w-100 mt-3">Change
                Password
              </button>
            </form>
          </div>
        </div>
        <div class="text-center mt-3">
          <a href="{% url 'profile' %}" class="btn btn-link">Back to
            Profile</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
