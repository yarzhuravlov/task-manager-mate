{% extends "base.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white">
            <h5 class="mb-0">Password Changed Successfully</h5>
          </div>
          <div class="card-body text-center">
            <p class="mb-4">Your password has been updated successfully. You
              can now use your new password to log in.</p>
            <a href="{% url 'profile' %}" class="btn btn-primary w-100">Back
              to Profile</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
