{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div>
    <h2>Login</h2>
    <form action="" method="POST">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-primary" style="float: right;">Login</button>
    </form>
    <p>
      Don't have an account? <a href="{% url 'register' %}">Sign up here</a>.
    </p>
  </div>
{% endblock %}
